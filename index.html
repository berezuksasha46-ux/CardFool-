<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CardFool - 1v1 Дурак</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  
  <style>
    :root {
      --bg-main: #0b0614;
      --bg-card: #150b26;
      --accent-gold: #f59e0b;
      --accent-gold-gradient: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --success: #10b981;
      --danger: #ef4444;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 90px; }

    .view { display: none; padding: 16px; }
    .view.active { display: block; }

    .btn {
      background: var(--accent-gold-gradient);
      color: #000; border: none; padding: 12px 20px;
      font-weight: bold; font-size: 15px; border-radius: 12px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }
    .btn:active { transform: scale(0.97); }
    .btn-secondary { background: #23163d; color: #fff; border: 1px solid var(--border-color); box-shadow: none; }

    .card-box, .table-card {
      background: var(--bg-card); border-radius: 16px; padding: 18px;
      margin-bottom: 14px; border: 1px solid var(--border-color);
    }
    .table-card { display: flex; justify-content: space-between; align-items: center; }
    .table-card.my-table { border-color: var(--accent-gold); background: linear-gradient(135deg, rgba(21, 11, 38, 1) 0%, rgba(45, 27, 14, 0.4) 100%); }
    .my-table-badge { font-size: 11px; background: rgba(251, 191, 36, 0.15); color: var(--accent-gold); padding: 3px 8px; border-radius: 6px; margin-bottom: 6px; display: inline-block; font-weight: bold; }

    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(21, 11, 38, 0.98); backdrop-filter: blur(10px);
      display: flex; justify-content: space-around; padding: 10px 0;
      border-top: 1px solid var(--border-color); z-index: 1000;
    }
    .nav-item { color: var(--text-muted); text-align: center; font-size: 11px; cursor: pointer; background: none; border: none; }
    .nav-item.active { color: var(--accent-gold); }
    .nav-icon { font-size: 20px; margin-bottom: 2px; }

    .avatar-container {
      width: 40px; height: 40px; background: var(--accent-gold-gradient);
      color: #000; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-weight: bold; overflow: hidden; flex-shrink: 0;
    }
    .avatar-container img { width: 100%; height: 100%; object-fit: cover; }

    .poker-table {
      background: radial-gradient(circle, #1a3c27 0%, #0e2216 100%);
      border: 2px solid #2d5a3c; border-radius: 20px; padding: 16px;
      min-height: 280px; display: flex; flex-direction: column; justify-content: space-between;
    }

    .card-item {
      width: 54px; height: 82px; background: #ffffff; color: #111;
      border-radius: 6px; display: flex; flex-direction: column; justify-content: space-between;
      padding: 4px; font-weight: bold; font-size: 13px; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer; border: 2px solid transparent;
    }
    .card-item.red { color: var(--danger); }
    .card-item.selected { transform: translateY(-12px); border-color: var(--accent-gold); }

    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85); z-index: 2000; align-items: center; justify-content: center; padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content { background: var(--bg-card); width: 100%; max-width: 400px; border-radius: 20px; padding: 22px; border: 1px solid var(--border-color); }
    .option-btn { background: #1e1033; border: 1px solid var(--border-color); color: #fff; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 13px; }
    .option-btn.selected { background: var(--accent-gold-gradient); color: #000; font-weight: bold; border-color: transparent; }
  </style>
</head>
<body>

  <!-- Шапка -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--bg-card); border-bottom: 1px solid var(--border-color);">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div id="header-avatar" class="avatar-container">U</div>
      <div>
        <div id="header-name" style="font-weight: bold; font-size: 15px;">Игрок</div>
        <div style="font-size: 12px; color: var(--text-muted);">Уровень <span id="header-level">1</span></div>
      </div>
    </div>
    <div style="background: rgba(251, 191, 36, 0.12); padding: 6px 14px; border-radius: 20px; color: var(--accent-gold); font-weight: bold;">
      ⭐ <span id="header-stars">0</span>
    </div>
  </div>

  <!-- Вкладка Столы -->
  <div id="lobbies-view" class="view active">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h2 style="font-size: 22px;">Игровые столы</h2>
      <button class="btn" onclick="openCreateTableModal()">Создать стол</button>
    </div>
    <div id="tables-container">
      <div style="text-align: center; color: var(--text-muted); margin-top: 50px;">Загрузка столов...</div>
    </div>
  </div>

  <!-- Вкладка Друзья -->
  <div id="friends-view" class="view">
    <h2 style="font-size: 22px; margin-bottom: 16px;">Друзья</h2>
    <div id="friends-list-container"><div style="text-align: center; color: var(--text-muted);">У вас пока нет друзей.</div></div>
  </div>

  <!-- Вкладка Игра -->
  <div id="game-view" class="view">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div id="opponent-avatar" class="avatar-container" style="width: 32px; height: 32px; font-size: 12px;">O</div>
        <div>
          <div id="opponent-name" style="font-weight: bold; font-size: 14px;">Ожидание соперника...</div>
          <div style="font-size: 11px; color: var(--text-muted);">Карт: <span id="opponent-card-count">0</span></div>
        </div>
      </div>
      <div style="background: var(--bg-card); padding: 6px 12px; border-radius: 8px; font-size: 13px;">
        Колода: <span id="deck-count">36</span> | Козырь: <span id="deck-card-view" style="font-weight: bold; font-size: 16px;">♠</span>
      </div>
    </div>

    <div class="poker-table">
      <div id="turn-indicator" style="text-align: center; font-weight: bold; font-size: 14px; color: var(--accent-gold);">Ожидание второго игрока...</div>
      <div id="table-cards-slot" style="display: flex; gap: 12px; min-height: 110px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 10px 0;"></div>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button id="action-btn-primary" class="btn" style="padding: 10px 20px;" onclick="sendReady()">Готов!</button>
        <button id="action-btn-secondary" class="btn btn-secondary" style="display: none; padding: 10px 20px;" onclick="handleGameAction('take')">Взять</button>
      </div>
    </div>

    <div style="font-size: 12px; color: var(--text-muted); margin-top: 12px; margin-bottom: 6px;">Ваши карты:</div>
    <div id="my-hand-container" style="display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; min-height: 95px;"></div>
  </div>

  <!-- Вкладка Лидеры -->
  <div id="leaderboard-view" class="view">
    <h2 style="font-size: 22px; margin-bottom: 16px;">Лидеры</h2>
    <div id="leaderboard-list"><div style="text-align: center; color: var(--text-muted);">Загрузка...</div></div>
  </div>

  <!-- Вкладка Профиль -->
  <div id="profile-view" class="view">
    <h2 style="font-size: 22px; margin-bottom: 16px;">Профиль</h2>
    <div class="card-box">
      <div style="font-size: 18px; font-weight: bold;" id="profile-name">Игрок</div>
      <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Баланс: <span id="profile-stars">0 ⭐</span></div>
    </div>
  </div>

  <!-- Нижняя панель навигации -->
  <div class="nav-bar">
    <button class="nav-item active" onclick="switchTab('lobbies', this)"><div class="nav-icon">🎲</div><div>Столы</div></button>
    <button class="nav-item" onclick="switchTab('friends', this)"><div class="nav-icon">👥</div><div>Друзья</div></button>
    <button class="nav-item" onclick="switchTab('leaderboard', this)"><div class="nav-icon">🏆</div><div>Лидеры</div></button>
    <button class="nav-item" onclick="switchTab('profile', this)"><div class="nav-icon">👤</div><div>Профиль</div></button>
  </div>

  <!-- Модальное окно создания стола (с возвращенными настройками колоды и ставок) -->
  <div id="create-table-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 16px; font-size: 20px;">Создать игровой стол</h3>
      <div style="margin-bottom: 12px;">
        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">Режим игры:</div>
        <div style="display: flex; gap: 8px;">
          <button id="mode-podkidnoy" class="option-btn selected" onclick="selectMode('podkidnoy')" style="flex: 1;">Подкидной</button>
          <button id="mode-perevodnoy" class="option-btn" onclick="selectMode('perevodnoy')" style="flex: 1;">Переводной</button>
        </div>
      </div>
      <div style="margin-bottom: 12px;">
        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">Колода:</div>
        <div style="display: flex; gap: 8px;">
          <button id="deck-36" class="option-btn selected" onclick="selectDeck(36)" style="flex: 1;">36 карт</button>
          <button id="deck-24" class="option-btn" onclick="selectDeck(24)" style="flex: 1;">24 карты</button>
        </div>
      </div>
      <div style="margin-bottom: 18px;">
        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">Ставка:</div>
        <div style="display: flex; gap: 6px;">
          <button class="option-btn selected" onclick="selectStake(10, this)" style="flex: 1;">10 ⭐</button>
          <button class="option-btn" onclick="selectStake(25, this)" style="flex: 1;">25 ⭐</button>
          <button class="option-btn" onclick="selectStake(50, this)" style="flex: 1;">50 ⭐</button>
          <button class="option-btn" onclick="selectStake(100, this)" style="flex: 1;">100 ⭐</button>
        </div>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" style="flex: 1;" onclick="closeCreateTableModal()">Отмена</button>
        <button class="btn" style="flex: 1;" onclick="submitCreateTable()">Создать</button>
      </div>
    </div>
  </div>
  <script>
    let tg = window.Telegram?.WebApp;
    if (tg && tg.expand) { tg.expand(); } 
    else { tg = { initDataUnsafe: { user: { id: Math.floor(Math.random() * 1000000), username: "User", first_name: "Игрок" } } }; }

    const socket = io();
    let currentUser = null;
    let selectedGameMode = 'podkidnoy';
    let selectedDeckSize = 36;
    let selectedStake = 10;
    let currentGameId = null;
    let myHandCards = [];
    let isMyTurnFlag = false;

    const initDataUnsafe = tg.initDataUnsafe || {};
    const telegramId = initDataUnsafe.user?.id || 12345;
    const firstName = initDataUnsafe.user?.first_name || 'Игрок';

    socket.emit('set_socket_user', telegramId);
    socket.emit('auth', { telegram_id: telegramId, username: initDataUnsafe.user?.username || 'User', first_name: firstName });

    socket.on('auth_success', (user) => {
      currentUser = user;
      updateProfileUI(user);
    });

    socket.on('error_message', (msg) => { alert(msg); });

    function updateProfileUI(user) {
      document.getElementById('header-stars').innerText = user.stars_balance || 0;
      document.getElementById('header-name').innerText = user.first_name || user.username;
      document.getElementById('profile-name').innerText = user.first_name || user.username;
      document.getElementById('profile-stars').innerText = (user.stars_balance || 0) + ' ⭐';
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(tabId + '-view').classList.add('active');
      if (el) el.classList.add('active');

      if (tabId === 'lobbies') socket.emit('get_lobbies');
    }

    socket.on('lobbies_list', (data) => {
      const container = document.getElementById('tables-container');
      if (!container) return;
      container.innerHTML = '';

      if (!data.tables || data.tables.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 50px;">Нет активных столов. Создайте свой!</div>';
        return;
      }

      data.tables.forEach(table => {
        // Корректное определение, чей это стол по уникальному ID хоста
        const isMy = String(table.hostId || table.host_id || table.creatorId) === String(telegramId);
        const card = document.createElement('div');
        card.className = isMy ? 'table-card my-table' : 'table-card';

        const badge = isMy ? '<div class="my-table-badge">Ваш стол</div>' : '';
        const tableId = table.id || table.tableId || table.roomId;

        card.innerHTML = `
          <div>
            ${badge}
            <div style="font-weight: bold; font-size: 15px;">Стол от ${table.hostName || table.name || 'Игрока'}</div>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">${table.deckSize || 36} карт • ⭐ ${table.stake || 10}</div>
          </div>
          <button class="btn" style="padding: 8px 16px; font-size: 14px;" onclick="joinTable('${tableId}')">Войти</button>
        `;
        container.appendChild(card);
      });
    });

    function openCreateTableModal() { document.getElementById('create-table-modal').classList.add('active'); }
    function closeCreateTableModal() { document.getElementById('create-table-modal').classList.remove('active'); }
    
    function selectMode(mode) {
      selectedGameMode = mode;
      document.getElementById('mode-podkidnoy').classList.toggle('selected', mode === 'podkidnoy');
      document.getElementById('mode-perevodnoy').classList.toggle('selected', mode === 'perevodnoy');
    }

    function selectDeck(size) {
      selectedDeckSize = size;
      document.getElementById('deck-36').classList.toggle('selected', size === 36);
      document.getElementById('deck-24').classList.toggle('selected', size === 24);
    }

    function selectStake(stake, el) {
      selectedStake = stake;
      el.parentElement.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
    }

    function submitCreateTable() {
      closeCreateTableModal();
      socket.emit('create_table', {
        mode: selectedGameMode,
        deckSize: selectedDeckSize,
        stake: selectedStake,
        telegram_id: telegramId,
        first_name: firstName
      });
    }

    socket.on('table_created', (data) => {
      const tId = (typeof data === 'string') ? data : (data?.tableId || data?.id || data?.roomId);
      if (tId) joinTable(tId);
      else socket.emit('get_lobbies');
    });

    function joinTable(tableId) {
      if (!tableId) return;
      currentGameId = tableId;
      
      // Отправляем все варианты событий подключения, чтобы сервер точно принял игрока
      socket.emit('join_table', { tableId: tableId, gameId: tableId, telegram_id: telegramId, first_name: firstName });
      socket.emit('join_room', tableId);
      socket.emit('join', { gameId: tableId, tableId: tableId, telegram_id: telegramId });

      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('game-view').classList.add('active');
      document.getElementById('turn-indicator').innerText = 'Подключено к столу. Ожидание соперника...';
    }

    function sendReady() {
      socket.emit('player_ready', { gameId: currentGameId, tableId: currentGameId, telegram_id: telegramId });
      socket.emit('ready', { gameId: currentGameId, tableId: currentGameId, telegram_id: telegramId });
      const btn = document.getElementById('action-btn-primary');
      btn.innerText = 'Ожидание соперника...';
      btn.disabled = true;
    }

    socket.on('game_state', (state) => {
      if (!state) return;
      currentGameId = state.gameId || state.id || currentGameId;

      const players = state.players || [];
      const opponent = players.find(p => String(p.id || p.telegram_id) !== String(telegramId)) || { name: 'Ожидание второго игрока...', handCount: 0 };
      
      document.getElementById('opponent-name').innerText = opponent.name || opponent.first_name || 'Соперник';
      document.getElementById('opponent-card-count').innerText = opponent.handCount !== undefined ? opponent.handCount : (opponent.hand ? opponent.hand.length : 0);
      document.getElementById('deck-count').innerText = state.deckCount !== undefined ? state.deckCount : 36;
      
      const trump = state.trumpCard || state.trump || '♠';
      const trumpSuit = typeof trump === 'object' ? trump.suit : trump;
      const trumpView = document.getElementById('deck-card-view');
      trumpView.innerText = trumpSuit;
      trumpView.style.color = ['♥', '♦'].includes(trumpSuit) ? '#ef4444' : '#ffffff';
    });

    socket.on('your_hand', (hand) => {
      myHandCards = hand || [];
      const container = document.getElementById('my-hand-container');
      container.innerHTML = '';
      myHandCards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = `card-item ${['♥','♦'].includes(card.suit) ? 'red' : ''}`;
        cardEl.innerHTML = `<span>${card.rank}</span><span style="font-size:18px; text-align:center;">${card.suit}</span><span style="transform: rotate(180deg);">${card.rank}</span>`;
        cardEl.onclick = () => {
          socket.emit('game_action', { gameId: currentGameId, action: 'play_card', cardIndex: index, card: card, telegram_id: telegramId });
        };
        container.appendChild(cardEl);
      });
    });

    socket.on('is_my_turn', (isMyTurn) => {
      isMyTurnFlag = isMyTurn;
      document.getElementById('turn-indicator').innerText = isMyTurn ? 'Ваш ход!' : 'Ход соперника...';
    });
  </script>
</body>
</html>
