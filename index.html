<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CardFool - 1v1 Дурак</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
  
  <style>
    :root {
      --bg-main: #0b0614;
      --bg-card: #150b26;
      --accent-gold: #f59e0b;
      --accent-gold-gradient: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --success: #10b981;
      --danger: #ef4444;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 80px; overflow-x: hidden; }

    .view { display: none; padding: 10px; }
    .view.active { display: block; }

    .btn {
      background: var(--accent-gold-gradient);
      color: #000; border: none; padding: 12px 24px;
      font-weight: bold; font-size: 15px; border-radius: 12px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }
    .btn:active { transform: scale(0.97); }
    .btn-secondary { background: #23163d; color: #fff; border: 1px solid var(--border-color); box-shadow: none; }

    .table-card { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 14px; border-radius: 12px; margin-bottom: 10px; }
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(21, 11, 38, 0.98); display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid var(--border-color); z-index: 1000; }
    .nav-item { color: var(--text-muted); text-align: center; font-size: 11px; cursor: pointer; background: none; border: none; }
    .nav-item.active { color: var(--accent-gold); }

    .avatar-container { width: 36px; height: 36px; background: var(--accent-gold-gradient); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

    /* Поле стола уменьшено по высоте для подтягивания карт вверх */
    .poker-table {
      background: radial-gradient(circle, #1a3c27 0%, #0e2216 100%);
      border: 2px solid #2d5a3c; border-radius: 16px; padding: 10px;
      min-height: 230px; display: flex; flex-direction: column; justify-content: space-between;
      position: relative; overflow: hidden; width: 100%;
    }

    /* Карты игрока подняты выше */
    #my-hand-container {
      display: flex; justify-content: center; align-items: center;
      padding: 5px 0 0 0; min-height: 110px; position: relative; margin-top: 2px;
    }
    .card-item {
      width: 62px; height: 92px; background: linear-gradient(145deg, #ffffff, #f0f0f0); color: #111;
      border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between;
      padding: 4px; font-weight: bold; font-size: 13px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; border: 1px solid rgba(0,0,0,0.2);
      position: relative; transition: transform 0.2s, z-index 0.2s; margin-left: -20px;
    }
    .card-item:first-child { margin-left: 0; }
    .card-item:hover { z-index: 10; transform: translateY(-12px) scale(1.05); }
    .card-item.red { color: var(--danger); }

    .table-card-item { width: 46px; height: 68px; background: #fff; color: #111; border-radius: 6px; display: flex; flex-direction: column; justify-content: space-between; padding: 3px; font-size: 11px; font-weight: bold; border: 1px solid #ccc; }
    .table-card-item.red { color: var(--danger); }
    .card-pair { position: relative; width: 54px; height: 78px; margin: 3px; }
    .card-pair .defend-card { position: absolute; top: 8px; left: 8px; z-index: 2; }

    .deck-side-container { position: absolute; right: 8px; top: 8px; display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.35); padding: 4px 6px; border-radius: 8px; font-size: 11px; z-index: 5; }
    .deck-stack { width: 26px; height: 38px; background: #23163d; border-radius: 4px; border: 1px solid var(--accent-gold); position: relative; }
    .trump-preview { position: absolute; bottom: -3px; right: -6px; width: 22px; height: 32px; background: #fff; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border: 1px solid #999; }
  </style>
</head>
<body>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg-card); border-bottom: 1px solid var(--border-color);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div id="header-avatar" class="avatar-container">U</div>
      <div>
        <div id="header-name" style="font-weight: bold; font-size: 14px;">Игрок</div>
        <div style="font-size: 11px; color: var(--text-muted);">ID: <span id="header-unique-id">------</span></div>
      </div>
    </div>
    <div style="background: rgba(251, 191, 36, 0.12); padding: 4px 12px; border-radius: 16px; color: var(--accent-gold); font-weight: bold; font-size: 13px;">
      ⭐ <span id="header-stars">0</span>
    </div>
  </div>

  <div id="lobbies-view" class="view active">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h2 style="font-size: 20px;">Столы</h2>
      <button class="btn" style="padding: 8px 14px; font-size: 13px;" onclick="openCreateTableModal()">Создать стол</button>
    </div>
    <div id="tables-container"></div>
  </div>

  <div id="game-view" class="view">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div id="opponent-avatar" class="avatar-container" style="width: 28px; height: 28px; font-size: 11px;">O</div>
        <div>
          <div id="opponent-name" style="font-weight: bold; font-size: 13px;">Соперник</div>
          <div style="font-size: 10px; color: var(--text-muted);">Карт: <span id="opponent-card-count">0</span></div>
        </div>
      </div>
    </div>

    <!-- Игровой стол -->
    <div class="poker-table">
      <div class="deck-side-container">
        <div style="text-align: right; line-height: 1;">
          <div style="font-size: 8px; color: var(--text-muted);">Колода</div>
          <div style="font-weight: bold;" id="deck-count">36</div>
        </div>
        <div class="deck-stack"><div id="deck-card-view" class="trump-preview">♠</div></div>
      </div>

      <div id="turn-indicator" style="text-align: center; font-weight: bold; font-size: 13px; color: var(--accent-gold);">Ожидание игрока...</div>
      <div id="table-cards-slot" style="display: flex; gap: 6px; min-height: 80px; justify-content: center; align-items: center; flex-wrap: wrap;"></div>
    </div>

    <!-- Карты в руке (подняты ближе к столу) -->
    <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Ваши карты:</div>
    <div id="my-hand-container"></div>

    <!-- Кнопки Бито / Взять перемещены ПОД карты в самый низ -->
    <div style="display: flex; justify-content: center; margin-top: 8px; min-height: 40px;">
      <button id="action-btn-bito" class="btn" style="display: none; min-width: 150px; padding: 10px;" onclick="handleGameAction('bito')">Бито</button>
      <button id="action-btn-take" class="btn btn-secondary" style="display: none; min-width: 150px; padding: 10px; border-color: var(--accent-gold);" onclick="handleGameAction('take')">Взять</button>
    </div>
  </div>

  <div class="nav-bar">
    <button class="nav-item active" onclick="switchTab('lobbies', this)"><div style="font-size: 18px;">🎲</div><div>Столы</div></button>
  </div>

  <script>
    let tg = window.Telegram?.WebApp;
    if (tg && tg.expand) tg.expand();

    const socket = io({ transports: ['websocket', 'polling'] });
    let currentUser = null, currentGameId = null, myHandCards = [], currentTrumpSuit = '♠';

    const initDataUnsafe = tg?.initDataUnsafe || {};
    const telegramId = initDataUnsafe.user?.id || 12345;
    const username = initDataUnsafe.user?.username || 'User_' + telegramId;
    const firstName = initDataUnsafe.user?.first_name || 'Игрок';

    socket.emit('set_socket_user', telegramId);
    socket.emit('auth', { telegram_id: telegramId, username, first_name: firstName });

    socket.on('auth_success', (user) => {
      currentUser = user;
      document.getElementById('header-stars').innerText = user.stars_balance || 0;
      document.getElementById('header-name').innerText = user.first_name || user.username;
      document.getElementById('header-unique-id').innerText = user.unique_id || '------';
    });

    socket.on('lobbies_list', (data) => {
      const container = document.getElementById('tables-container');
      if (!container) return;
      container.innerHTML = '';
      (data.tables || []).forEach(table => {
        container.innerHTML += `
          <div class="table-card">
            <div>
              <div style="font-weight: bold;">Стол от ${table.hostName}</div>
              <div style="font-size: 11px; color: var(--text-muted);">${table.mode === 'perevodnoy' ? 'Переводной' : 'Подкидной'} • ⭐ ${table.stake}</div>
            </div>
            <button class="btn" style="padding: 6px 12px; font-size: 12px;" onclick="joinTable('${table.id}')">Войти</button>
          </div>`;
      });
    });

    function joinTable(tId) {
      currentGameId = tId;
      socket.emit('join_table', tId);
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('game-view').classList.add('active');
    }

    socket.on('game_state', (state) => {
      if (!state) return;
      const opponent = (state.players || []).find(p => p.name !== firstName) || { name: 'Соперник', handCount: 0 };
      document.getElementById('opponent-name').innerText = opponent.name;
      document.getElementById('opponent-card-count').innerText = opponent.handCount;
      document.getElementById('deck-count').innerText = state.deckCount;
      
      const trump = state.trumpCard || '♠';
      currentTrumpSuit = typeof trump === 'object' ? trump.suit : trump;
      const trumpView = document.getElementById('deck-card-view');
      trumpView.innerText = currentTrumpSuit;
      trumpView.style.color = ['♥', '♦'].includes(currentTrumpSuit) ? '#ef4444' : '#111';

      const tableSlot = document.getElementById('table-cards-slot');
      tableSlot.innerHTML = '';
      (state.tableCards || []).forEach(pair => {
        let pairDiv = document.createElement('div');
        pairDiv.className = 'card-pair';
        if (pair.attack) pairDiv.innerHTML += `<div class="table-card-item ${['♥','♦'].includes(pair.attack.suit)?'red':''}"><span>${pair.attack.rank}</span><span style="text-align:center;">${pair.attack.suit}</span></div>`;
        if (pair.defend) pairDiv.innerHTML += `<div class="table-card-item defend-card ${['♥','♦'].includes(pair.defend.suit)?'red':''}"><span>${pair.defend.rank}</span><span style="text-align:center;">${pair.defend.suit}</span></div>`;
        tableSlot.appendChild(pairDiv);
      });
    });

    socket.on('your_hand', (hand) => {
      myHandCards = hand || [];
      sortMyHand();
      renderMyHand();
    });

    function sortMyHand() {
      const rankOrder = { '6':6, '7':7, '8':8, '9':9, '10':10, 'J':11, 'Q':12, 'K':13, 'A':14 };
      myHandCards.sort((a, b) => {
        const aIsTrump = a.suit === currentTrumpSuit ? 100 : 0;
        const bIsTrump = b.suit === currentTrumpSuit ? 100 : 0;
        return (aIsTrump + (rankOrder[a.rank] || 0)) - (bIsTrump + (rankOrder[b.rank] || 0));
      });
    }

    function renderMyHand() {
      const container = document.getElementById('my-hand-container');
      container.innerHTML = '';
      myHandCards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = `card-item ${['♥','♦'].includes(card.suit) ? 'red' : ''}`;
        const angle = (index - (myHandCards.length - 1) / 2) * 3;
        cardEl.style.transform = `rotate(${angle}deg)`;
        cardEl.innerHTML = `<span>${card.rank}</span><span style="font-size:18px; text-align:center;">${card.suit}</span>`;
        cardEl.onclick = () => socket.emit('game_action', { gameId: currentGameId, action: 'play_card', cardIndex: index });
        container.appendChild(cardEl);
      });
    }

    socket.on('is_turn_data', (data) => {
      document.getElementById('turn-indicator').innerText = data.isMyTurn ? (data.isAttacker ? 'Ваш ход (Атака)' : 'Ваш ход (Защита)') : 'Ход соперника...';
      document.getElementById('action-btn-bito').style.display = (data.isMyTurn && data.isAttacker) ? 'inline-block' : 'none';
      document.getElementById('action-btn-take').style.display = (data.isMyTurn && !data.isAttacker) ? 'inline-block' : 'none';
    });

    function handleGameAction(actionType) {
      socket.emit('game_action', { gameId: currentGameId, action: actionType });
    }
  </script>
</body>
</html>
